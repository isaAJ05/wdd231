<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanks | BookVerse</title>
    <meta name="description" content="Thank you for submitting the BookVerse form.">
    <meta name="author" content="Isabella Arrieta">
    <link rel="icon" href="images/logo-bookverse.png" type="image/png">
    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/larger.css">
</head>
<body>
<main class="hero">
    <div class="hero-content">
        <h1>Thank You</h1>
        <p>Your form was submitted successfully. Here is the information you sent:</p>

        <section class="book-section" aria-labelledby="submitted-title">
            <h2 id="submitted-title">Submitted Details</h2>
            <div id="submitted-data" class="about-card"></div>
        </section>

        <a href="index.html" class="search-book-btn">Return Home</a>
    </div>
</main>

<script>
    const params = new URLSearchParams(window.location.search);
    const submittedData = document.querySelector("#submitted-data");

    const email = params.get("email");
    const message = params.get("message");

    if (email || message) {
        submittedData.innerHTML = `
            <p><strong>Email:</strong> ${email || "Not provided"}</p>
            <p><strong>Message:</strong> ${message || "Not provided"}</p>
        `;
    } else {
        submittedData.innerHTML = `
            <p>No form data was found in the URL.</p>
        `;
    }
</script>
</body>
</html>
