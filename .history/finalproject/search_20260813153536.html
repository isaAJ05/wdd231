<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Search | BookVerse</title>

    <meta
        name="description"
        content="Search for books, authors, and stories on BookVerse."
    >

    <meta name="author" content="Isabella Arrieta">
    <meta property="og:title" content="Search | BookVerse">
    <meta property="og:description" content="Search the BookVerse catalog and explore detailed book information.">
    <meta property="og:image" content="images/logo-bookverse.png">
    <meta property="og:url" content="search.html">

    <link rel="icon" href="images/logo-bookverse.png" type="image/png">

    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/larger.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&family=Open+Sans:wght@300;400;600;700&family=Play:wght@400;700&family=Raleway:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <script src="../scripts/getdates.js" defer></script>
    <script src="../scripts/hamburguer.js" defer></script>
    <script type="module" src="scripts/search.js" defer></script>
</head>

<body>

    <header>

        <div class="site-name">
            <img
                src="images/logo-big3.png"
                alt="BookVerse logo"
                width="224"
                height="81"
            >
        </div>

        <button id="menu" aria-label="Open menu"></button>

        <nav>
            <ul class="navigation">

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="favorites.html">Favorites</a>
                </li>

                <li>
                    <a href="about.html">About</a>
                </li>

                <li>
                    <a href="search.html" class="active">Search</a>
                </li>

            </ul>
        </nav>

    </header>


    <main>

        <section class="search-page">

            <h1>Find Your Next Book</h1>

            <p>
                Search for books by title, author, or keyword.
            </p>

            <form id="contact-form" class="search-form" method="get" action="thanks.html">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    required
                >

                <label for="message">
                    Message
                </label>

                <textarea
                    id="message"
                    name="message"
                    rows="4"
                    placeholder="Tell us what kinds of books you want to find"
                    required
                ></textarea>

                <button type="submit">
                    Send Message
                </button>

            </form>

            <form id="search-form" class="search-form">

                <label for="book-search">
                    Search for a book
                </label>

                <input
                    type="search"
                    id="book-search"
                    name="book-search"
                    placeholder="Search by title or author"
                    required
                >

                <button type="submit">
                    Search
                </button>

            </form>

        </section>


        <section
            class="search-results-section"
            id="search-results-section"
        >

            <h2 id="search-title">
                Search Results
            </h2>

            <div
                id="search-results"
                class="book-grid"
            >
            </div>

        </section>


        <!-- Modal -->

        <div id="book-modal" class="modal">

            <div class="modal-content">

                <button
                    id="close-modal"
                    class="close-modal"
                    aria-label="Close"
                >
                    &times;
                </button>

                <div id="modal-book"></div>

            </div>

        </div>

    </main>


    <footer>

        <section class="contact">

            <h2>BookVerse</h2>

            <p>Discover your next great read.</p>

            <p>contact@bookverse.com</p>

        </section>


        <section class="social">

            <h2>Follow Us</h2>

            <div class="icons">

                <a
                    href="https://www.facebook.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <img
                        src="images/icons8-facebook-50.png"
                        alt="Facebook"
                    >
                </a>

                <a
                    href="https://www.instagram.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <img
                        src="images/icons8-instagram-50.png"
                        alt="Instagram"
                    >
                </a>

                <a
                    href="https://www.linkedin.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <img
                        src="images/icons8-linkedin-50.png"
                        alt="LinkedIn"
                    >
                </a>

            </div>

        </section>


        <section class="development">

            <p>WDD231 Class Project</p>

            <p>Isabella Arrieta</p>

            <p>
                &copy;
                <span id="currentyear"></span>
                BookVerse
            </p>

            <p><a href="attributions.html">Attributions</a></p>

            <p><a href="https://drive.google.com/drive/folders/1dRWVrR_kGJfllJRWKM6_KOTFTHIlJZMz?usp=sharing">Link Video</a></p>

            <p class="last-modified">
                Last Modified:
                <span id="lastModified"></span>
            </p>

        </section>

    </footer>

</body>
</html>
